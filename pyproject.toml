[project]
name = "agentic-tool-kit"
version = "0.1.0"
description = "A prototype for consistent tool schema generation and execution for agentic AI systems."
authors = [{ name = "AutoScout" }]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = "." # Allow imports from current directory for tests
